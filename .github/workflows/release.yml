# 推一个 vX.Y.Z 的标签时自动发版：跑测试、构建、打包、建 GitHub Release。
# 发布包里的版本号和标签对不上就直接失败，避免发错版本。
#
# 本地等价的做法是 `bun run release`（用 gh 发布）。这里走的是 GitHub 自己的权限，
# 不需要你在电脑上登录 gh。

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write        # 建 Release、传附件需要

# 同一个标签只跑一个：偶尔的重复触发会排队而不是各建一次 Release。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test

      # 打包前先核对：package.json 的版本必须等于标签去掉 v 之后的部分。
      - name: 核对版本号和标签一致
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(bun -e "console.log(require('./package.json').version)")"
          echo "标签=$tag 包=$pkg"
          [ "$tag" = "$pkg" ] || { echo "版本号对不上，先跑 bun run bump 再打标签"; exit 1; }

      # bun pm pack 会先触发 prepack（构建 + 产物自检），自检不过不会产出。
      - run: bun pm pack --filename agent-core.tgz
      - run: bun pm pack

      # 建 Release；万一这个标签已经建过（重复触发），改成补传附件，不报错。
      # 幂等是这个任务该有的性质：同样一个标签跑几次，结果都一样。
      - name: 建 Release（已存在就补传附件）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(agent-core.tgz "kernel4632-agent-core-${GITHUB_REF_NAME#v}.tgz")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "$GITHUB_REF_NAME" \
              --notes "轻量的 AI Agent 核心：给它模型地址和工具文件，自动循环「问模型 → 执行工具 → 再问模型」。支持 OpenAI Chat / Responses、Anthropic、Gemini 四种协议，工具、MCP、技能、上下文压缩、提示词缓存；纯对话模型也能用工具。"
          fi
